[tool.poetry]
name = "waste-sort"
version = "0.1.0"
description = "Waste classification from photos using EfficientNet-B2 / ResNet-18 (PyTorch Lightning)"
authors = ["Aleksandr Astafurov"]
readme = "README.md"
packages = [{include = "waste_sort"}]

[tool.poetry.scripts]
waste-sort = "waste_sort.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.2"
torchvision = "^0.17"
pytorch-lightning = "^2.2"
torchmetrics = "^1.3"
albumentations = "^2.0"
hydra-core = "^1.3"
omegaconf = "^2.3"
pillow = "^10.0"
onnx = "^1.16"
onnxruntime = "^1.17"
typing-extensions = "^4.0"

[tool.poetry.group.train.dependencies]
mlflow = "^2.12"
matplotlib = "^3.8"
scikit-learn = "^1.4"
kaggle = "^1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.4"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
